<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Customer Portal - Time Trucking Auto-Quote</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body data-page="customer-portal">
    <div class="public-shell">
      <header class="public-header">
        <div class="brand-shell"><div class="brand-logo" aria-hidden="true"><span>TIME</span><span>TRUCKING</span></div><div class="brand-copy"><strong class="brand-title">TIME TRUCKING</strong><span class="brand-subtitle">Customer Portal</span></div></div>
      </header>
      <main class="content">
        <section class="hero">
          <p class="eyebrow">Secure customer portal</p>
          <h1>Quote response status</h1>
          <p class="muted">View quote status and accepted/declined state. Internal pricing rules, notes, costs, dispatch details, and reports are never shown here.</p>
        </section>
        <section class="card" id="customerPortalCard"></section>
        <output id="customerPortalOutput"></output>
      </main>
    </div>
    <script type="module" src="../src/app.ts"></script>
  </body>
</html>
