<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Create RFQ Link - Time Trucking Auto-Quote</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body data-page="create">
    <div class="shell">
      <header class="header">
        <div class="brand-shell"><img class="brand-logo-img" src="./time-trucking-logo.png" alt="Time Trucking - Total Logistic Solutions" /><div class="brand-copy"><span class="brand-subtitle">Auto-Quote</span></div></div>
        <nav class="nav">
          <a data-nav="dashboard" href="./index.html">Dashboard</a>
          <a data-nav="create" href="./create-rfq-link.html">Quote Requests</a>
          <a data-nav="review" href="./quote-review.html">Quotes</a>
          <a data-nav="accepted-loads" href="./accepted-loads.html">Accepted Loads</a>
          <a data-nav="pricing" href="./pricing-settings.html">Pricing</a>
          <a data-nav="customers" href="./customers.html">Customers</a>
          <a data-nav="users" href="./users-dashboard.html">Users</a>
          <a data-nav="admin-settings" href="./admin-settings.html">Settings</a>
        </nav>
      </header>
      <main class="content">
        <section class="hero">
          <p class="eyebrow">Secure client intake</p>
          <h1>Create RFQ link</h1>
          <p class="muted">Generate a private link that can be sent to a client. Production email delivery runs through the secure server-side integration once provider secrets are configured.</p>
        </section>
        <form class="card" id="createLinkForm">
          <div class="grid two">
            <label>Company name<input name="companyName" required /></label>
            <label>Client email<input name="email" type="email" required /></label>
            <label>Reference number<input name="referenceNumber" /></label>
            <label>Expires on<input name="expiresOn" type="date" /></label>
          </div>
          <button class="primary" type="submit">Create secure RFQ link</button>
          <output id="linkOutput"></output>
        </form>
      </main>
    </div>
    <script type="module" src="../src/app.ts"></script>
  </body>
</html>
