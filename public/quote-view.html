<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Customer Quote - Time Trucking Auto-Quote</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body data-page="quote-view">
    <div class="public-shell">
      <header class="public-header">
        <div class="brand-shell"><div class="brand-logo" aria-hidden="true"><span>TIME</span><span>TRUCKING</span></div><div class="brand-copy"><strong class="brand-title">TIME TRUCKING</strong><span class="brand-subtitle">Customer Quote</span></div></div>
      </header>
      <main class="content">
        <section class="hero">
          <p class="eyebrow">Secure customer quote</p>
          <h1>Review your transport quote</h1>
          <p class="muted">Accept, decline, or request a revision for this Time Trucking quote. Only customer-safe quote details are shown here.</p>
        </section>
        <section class="card" id="quoteViewCard"></section>
        <output id="quoteViewOutput"></output>
      </main>
    </div>
    <script type="module" src="../src/app.ts"></script>
  </body>
</html>
