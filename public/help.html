<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Time Trucking Assistant - Time Trucking Auto-Quote</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body data-page="help">
    <div class="shell">
      <header class="header">
        <div class="brand-shell"><img class="brand-logo-img" src="./time-trucking-logo.png" alt="Time Trucking - Total Logistic Solutions" /><div class="brand-copy"><span class="brand-subtitle">Help</span></div></div>
        <nav class="nav">
          <a data-nav="dashboard" href="./index.html">Dashboard</a>
          <a data-nav="create" href="./create-rfq-link.html">Quote Requests</a>
          <a data-nav="review" href="./quote-review.html">Quotes</a>
          <a data-nav="accepted-loads" href="./accepted-loads.html">Accepted Loads</a>
          <a data-nav="pricing" href="./pricing-settings.html">Pricing</a>
          <a data-nav="customers" href="./customers.html">Customers</a>
          <a data-nav="users" href="./users-dashboard.html">Users</a>
          <a data-nav="admin-settings" href="./admin-settings.html">Settings</a>
          <a data-nav="help" href="./help.html">Help</a>
        </nav>
      </header>
      <main class="content">
        <section class="hero">
          <p class="eyebrow">Internal guided assistant</p>
          <h1>Time Trucking Assistant</h1>
          <p class="muted">Search Time Trucking workflows, pricing rules, route blockers, invitation steps, settings, and role permissions.</p>
        </section>
        <section class="card assistant-panel">
          <div class="card-heading"><h2>How can I help?</h2><span>Internal use only</span></div>
          <label class="field">
            <span>Search help</span>
            <input
              id="assistantSearch"
              type="search"
              autocomplete="off"
              placeholder="Try: create a quote, change Semi rates, invite a user, email setup, why is this quote blocked?"
            />
          </label>
          <div class="assistant-shortcuts" aria-label="Common help shortcuts">
            <button type="button" data-assistant-query="create quote">Create a quote</button>
            <button type="button" data-assistant-query="quote blocked review required">Why is this quote blocked?</button>
            <button type="button" data-assistant-query="change commercial rates semi rate card">Change commercial rates</button>
            <button type="button" data-assistant-query="invite user create password">Invite a user</button>
            <button type="button" data-assistant-query="connect email integration">Connect email</button>
            <button type="button" data-assistant-query="return load backload">Return loads</button>
          </div>
          <div id="assistantContext" class="assistant-context"></div>
          <div id="assistantCategories" class="assistant-categories" aria-label="Help categories"></div>
          <div id="helpContent"></div>
        </section>
      </main>
    </div>
    <script type="module" src="../src/app.ts"></script>
  </body>
</html>
